<style>
:root{--bg:#0b1626;--panel:#122238;--panel2:#18304d;--line:#27425f;--text:#eaf0f7;--mute:#93a6bd;--amber:#f5a623;--amber2:#ffc861;--ok:#3ecf8e;--bad:#ff6b6b;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;border-bottom:2px solid var(--amber);background:var(--panel)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#ver{font-size:11px;color:var(--mute);line-height:1}
.brand{display:flex;flex-direction:column;gap:2px}
.brand img{display:block;height:24px;width:auto}
.brand .ttl{font-size:12px;font-weight:700;color:var(--amber2);letter-spacing:.3px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mute);padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.lang button.on{background:var(--amber);color:#1a1200;font-weight:700}
main{max-width:640px;margin:0 auto;padding:12px 14px 8px}
h1{font-size:19px;margin:2px 0 2px}
.sub{color:var(--mute);margin:0 0 6px;font-size:13px;line-height:1.35}
label{display:block;font-weight:600;font-size:13px;margin:11px 0 4px}
label i{font-style:normal;color:var(--mute);font-weight:400}
input,select,textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:15px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--amber2);outline-offset:1px}
.seg{display:grid;gap:8px}
.seg label{margin:0;display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;font-weight:500;cursor:pointer}
.seg input{width:auto;accent-color:var(--amber)}
.seg label:has(input:checked){border-color:var(--amber);background:var(--panel2)}
.err{color:var(--bad);font-size:13px;min-height:0;margin-top:4px}
.btn{display:block;width:100%;margin-top:0;background:var(--amber);color:#1a1200;border:0;border-radius:var(--r);padding:14px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line);margin-top:10px}
.note{margin-top:14px;font-size:13px;color:var(--mute)}
.banner{border-radius:var(--r);padding:12px 14px;margin:0 0 14px;font-size:14px}
.banner.ok{background:#12372b;border:1px solid var(--ok)}
.banner.warn{background:#3b2f10;border:1px solid var(--amber)}
.hidden{display:none!important}
footer{text-align:center;color:var(--mute);font-size:12px;padding:18px}
.modal{position:fixed;inset:0;background:rgba(3,8,16,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:380px}
.card h2{margin:0 0 4px;font-size:19px}
.admin-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-bar button{width:auto;margin:0;padding:8px 14px}
.atile{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:16px;margin-top:14px;color:var(--mute)}

.grid{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2>div{min-width:0}
.seg{gap:6px}
.seg label{padding:8px 10px;font-size:14px;border-radius:10px}
.seg.two,#type{grid-template-columns:1fr 1fr}
.seg label span{line-height:1.2}
.sendbar{position:sticky;bottom:0;margin:12px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(11,22,38,0))}
.err{line-height:1.2}
.err:empty{display:none}
.note{margin:4px 0 0}
footer{padding:6px}
@media (min-width:900px) and (min-height:620px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  main{flex:1;min-height:0;width:100%;max-width:1180px;padding:12px 24px 0;display:flex;flex-direction:column}
  #crew{flex:1;min-height:0;display:flex;flex-direction:column}
  .head{display:flex;align-items:baseline;gap:14px;margin-bottom:2px}
  .head .sub{margin:0}
  #notice{flex:none}
  #f{flex:1;min-height:0;display:flex;flex-direction:column}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:26px}
  .col{display:flex;flex-direction:column;min-height:0}
  .col.grow textarea{flex:1;min-height:60px;resize:none}
  .sendbar{position:static;margin:10px 0 0;padding:0;background:none;display:flex;justify-content:flex-end}
  .sendbar .btn{width:340px}
  .td{display:none}
  .pic svg{width:42px;height:42px}
  .pic img{height:58px}
  .pic{padding:5px 0 3px}
  .pick{padding:6px 8px 7px}
}
@media (min-width:900px) and (max-height:619px){main{max-width:1000px}}

.tiles{display:grid;gap:8px}
.tiles.two{grid-template-columns:1fr 1fr}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pic{width:100%;position:relative;border:0;background:#e5f0f5;padding:8px 0 5px;cursor:pointer;display:flex;justify-content:center;color:inherit}
.pic svg{width:54px;height:54px;display:block}
.pic img{height:86px;width:auto;display:block}
.big img{height:150px;width:auto;display:block;margin:8px auto;border-radius:10px}
.big{background:#e5f0f5;border-radius:12px;margin-top:6px}
.pic .q{border-color:#1b3a63!important;color:#1b3a63!important}
.pic .q{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;border:1.5px solid #c3d0e0;color:#e6edf6;font:700 12px/17px system-ui,sans-serif;text-align:center}
.pick{margin:0;padding:7px 8px 9px;display:block;cursor:pointer;font-weight:400}
.pick input{position:absolute;opacity:0;pointer-events:none}
.tt{display:block;font-weight:700;font-size:14px;line-height:1.2;color:#fff}
.td{display:block;font-size:12px;line-height:1.3;color:#c9d6e6;margin-top:3px}
.tile:has(input:checked){border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.tile:has(input:focus-visible){outline:2px solid var(--amber2);outline-offset:1px}
.sublab{font-weight:600;font-size:13px;margin:10px 0 4px}
.tiles.three .tt{font-size:13px}.tiles.three .td{display:none}
.card{position:relative}
.xbtn{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.big svg{width:130px;height:130px;display:block;margin:8px auto 8px}
.exl{font-size:13px;color:var(--amber2);margin:0;line-height:1.35}
</style>
</head>

<main>
  <!-- CREW VIEW -->
  <section id="crew">
    <div class="head"><h1 data-t="title">Report what you see on site</h1>
    <p class="sub" data-t="sub">Unsafe acts, unsafe conditions, near misses or positive observations. Takes about a minute, and small things count.</p></div>
    <div id="notice"></div>
    <form id="f" novalidate autocomplete="off">
      <div class="grid">
        <div class="col">
          <div class="row2">
            <div><label for="date" data-t="date">Date</label><input type="date" id="date" required><div class="err" data-e="date"></div></div>
            <div><label for="contractor" data-t="contractor">Contractor</label><select id="contractor" required></select><div class="err" data-e="contractor"></div></div>
          </div>
          <label for="name" data-t="name">Your name</label>
          <input id="name" maxlength="80" required><div class="err" data-e="name"></div>
          <label for="location" data-t="location">Location</label>
          <select id="location" required></select>
          <input id="locationOther" class="hidden" maxlength="80" style="margin-top:6px" data-ph="locOther">
          <div class="err" data-e="location"></div>
        </div>
        <div class="col">
          <label data-t="type">What are you reporting?</label>
          <div id="typeBox"><div class="tiles two" id="t1"></div><div class="sublab hidden" id="subLab"></div><div class="tiles three hidden" id="t2"></div></div><div class="err" data-e="type"></div>
          <label for="risk" data-t="risk">Critical risk control category</label>
          <select id="risk" required></select><div class="err" data-e="risk"></div>
          <label data-t="status">Status</label>
          <div class="seg two" id="status"></div><div class="err" data-e="status"></div>
        </div>
        <div class="col grow">
          <label for="desc" data-t="desc">What did you see?</label>
          <textarea id="desc" maxlength="1500" required></textarea><div class="err" data-e="desc"></div>
          <label for="rec" data-t="rec">Recommendation or action taken</label>
          <textarea id="rec" maxlength="1500" required></textarea><div class="err" data-e="rec"></div>
        </div>
      </div>
      <div class="sendbar"><button class="btn" id="send" type="submit" data-t="send">Send report</button></div>
    </form>
    <p class="note" id="queueNote"></p>
  </section>

  <!-- ADMIN VIEW (placeholder until trends are built) -->
  <section id="admin" class="hidden">
    <div class="admin-bar"><h1 data-t="adminTitle">Admin trends</h1><button class="btn ghost" id="logout" type="button" data-t="logout">Log out</button></div>
    <p class="sub" id="adminWho"></p>
    <div class="atile" id="adminBody" data-t="adminSoon">Trend dashboard comes next. Login is working.</div>
  </section>
</main>

<footer><span id="modeTxt"></span></footer>

<!-- INFO POPUP -->
<div class="modal hidden" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="inT">
  <div class="card" style="max-width:340px;text-align:center">
    <button class="xbtn" id="inX" type="button" aria-label="Close">&times;</button>
    <div class="big" id="inPic"></div>
    <h2 id="inT"></h2>
    <p class="sub" id="inD" style="margin:6px 0 8px;font-size:14px;color:#c3d0e0"></p>
    <p class="exl" id="inEx"></p>
    <button class="btn" id="inGo" type="button" style="margin-top:14px"></button>
  </div>
</div>

<!-- LOGIN MODAL -->
<div class="modal hidden" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="lgT">
  <form class="card" id="lf" autocomplete="off">
    <h2 id="lgT" data-t="loginTitle">Admin login</h2>
    <p class="sub" style="margin-bottom:0" data-t="loginSub">Authorised users only.</p>
    <label for="em" data-t="email">Email</label>
    <input id="em" type="email" inputmode="email" autocomplete="username">
    <label for="pin" data-t="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <div class="err" id="lgErr"></div>
    <button class="btn" id="lgGo" type="submit" data-t="login">Log in</button>
    <button class="btn ghost" id="lgX" type="button" data-t="cancel">Cancel</button>
  </form>
</div>

function opt(v,t){var o=document.createElement('option');o.value=v;o.textContent=t;return o;}
function buildSeg(box,name,items,onpick){
  box.innerHTML='';
  items.forEach(function(it){
    var l=document.createElement('label'),i=document.createElement('input');
    i.type='radio';i.name=name;i.value=it[0];
    i.addEventListener('change',function(){onpick(it[0]);});

function mkTile(k,name){
  var t=document.createElement('div');t.className='tile';
  var pic=document.createElement('button');pic.type='button';pic.className='pic';pic.setAttribute('aria-label',L(k)[0]+' – '+tr('more'));
  pic.innerHTML=ICON[k]+'<span class="q" aria-hidden="true">?</span>';
  pic.addEventListener('click',function(){openInfo(k);});
  var lb=document.createElement('label');lb.className='pick';
  var i=document.createElement('input');i.type='radio';i.name=name;i.value=k;
  i.addEventListener('change',function(){choose(k);});
  lb.appendChild(i);
  var a=document.createElement('span');a.className='tt';a.textContent=L(k)[0];
  var b=document.createElement('span');b.className='td';b.textContent=L(k)[1];
  lb.appendChild(a);lb.appendChild(b);t.appendChild(pic);t.appendChild(lb);return t;
}
function renderTiles(){
  var t1=$('t1'),t2=$('t2');t1.innerHTML='';t2.innerHTML='';

  ['pos','ua','uc'].forEach(function(k){t2.appendChild(mkTile(k,'t2'));});

function closeInfo(){$('infoModal').classList.add('hidden');}
function build(){
  var c=$('contractor'),cv=c.value; c.innerHTML='';c.appendChild(opt('',tr('pick')));CONTRACTORS.forEach(function(x){c.appendChild(opt(x,x));}); c.value=cv;
  var l=$('location'),lv=l.value; l.innerHTML='';l.appendChild(opt('',tr('pick')));LOCATIONS.forEach(function(x){l.appendChild(opt(x,x));});l.appendChild(opt('__other',tr('other')));l.value=lv;
  var r=$('risk'),rv=r.value; r.innerHTML='';r.appendChild(opt('',tr('pick')));RISKS.forEach(function(x){r.appendChild(opt(x,x));});r.value=rv;
  renderTiles();
  buildSeg($('status'),'status',STATUS,function(v){statusSel=v;});
  [['status',statusSel]].forEach(function(p){
    if(!p[1])return;var el=document.querySelector('#'+p[0]+' input[value="'+p[1].replace(/"/g,'\\"')+'"]');if(el)el.checked=true;
  });
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=tr(e.getAttribute('data-t'));});
  document.querySelectorAll('[data-ph]').forEach(function(e){e.placeholder=tr(e.getAttribute('data-ph'));});
  $('lEN').classList.toggle('on',lang==='en');$('lID').classList.toggle('on',lang==='id');
  build();updateQueueNote();updateMode();
  if(session)$('adminWho').textContent=tr('signed')+session.email;
}
function setLang(l){lang=l;try{localStorage.setItem('uauc_lang',l);}catch(e){}applyLang();}
function updateMode(){$('ver').textContent=VERSION;$('modeTxt').textContent=API_URL?tr('live'):tr('preview');}

/* ====== FORM ====== */
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function uuid(){
  try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function setErr(k,on){var e=document.querySelector('[data-e="'+k+'"]');if(e)e.textContent=on?tr('req'):'';}
function collect(){
  var loc=$('location').value; if(loc==='__other')loc=$('locationOther').value.trim();
  return {date:$('date').value,contractor:$('contractor').value,name:$('name').value.trim(),location:loc,type:typeSel,
    description:$('desc').value.trim(),recommendation:$('rec').value.trim(),risk:$('risk').value,status:statusSel};
}
function validate(d){
  var bad={date:!d.date,contractor:!d.contractor,name:!d.name,location:!d.location,type:!d.type,desc:!d.description,rec:!d.recommendation,risk:!d.risk,status:!d.status};
  var any=false;for(var k in bad){setErr(k,bad[k]);if(bad[k])any=true;}
  return !any;
}
function notice(kind,msg){var n=$('notice');n.innerHTML='';var b=document.createElement('div');b.className='banner '+kind;b.textContent=msg;n.appendChild(b);window.scrollTo(0,0);}

function post(body){
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}).then(function(r){return r.json();});
}
var QK='uauc_queue';
function getQ(){try{return JSON.parse(localStorage.getItem(QK)||'[]');}catch(e){return [];}}
function setQ(q){try{localStorage.setItem(QK,JSON.stringify(q));}catch(e){}}
function updateQueueNote(){var n=getQ().length;$('queueNote').textContent=n?(n+' '+tr('pending')):'';}
function flushQueue(){
  if(!API_URL)return;var q=getQ();if(!q.length)return;
  var p=Promise.resolve(),left=[];
  q.forEach(function(item){p=p.then(function(){return post(item).then(function(r){if(!r||!r.ok)left.push(item);}).catch(function(){left.push(item);});});});
  p.then(function(){setQ(left);updateQueueNote();});
}
function resetForm(){
  $('f').reset();typeSel='';statusSel='';s1='';s2='';$('date').value=today();$('locationOther').classList.add('hidden');build();
  var keep=null;try{keep=localStorage.getItem('uauc_name');}catch(e){} if(keep)$('name').value=keep;
}
function onSubmit(ev){
  ev.preventDefault();
  var d=collect();if(!validate(d))return;
  d.action='submit';d.id=uuid();
  try{localStorage.setItem('uauc_name',d.name);}catch(e){}
  var btn=$('send');btn.disabled=true;btn.textContent=tr('sending');
  var done=function(kind,msg){btn.disabled=false;btn.textContent=tr('send');notice(kind,msg);};
  if(!API_URL){resetForm();return done('warn',tr('previewOk'));}
  post(d).then(function(r){
    if(r&&r.ok){resetForm();done('ok',tr('ok'));}
    else{done('warn',tr('fail'));}
  }).catch(function(){
    var q=getQ();q.push(d);setQ(q);updateQueueNote();resetForm();done('warn',tr('queued'));
  });
}

/* ====== ADMIN LOGIN ====== */
var session=null;
function openLogin(){
  if(session){showAdmin();return;}
  $('lgErr').textContent='';$('pin').value='';$('loginModal').classList.remove('hidden');$('em').focus();
}
function closeLogin(){$('loginModal').classList.add('hidden');if(location.hash==='#admin'){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}}
function showAdmin(){
  $('crew').classList.add('hidden');$('admin').classList.remove('hidden');
  $('adminWho').textContent=tr('signed')+session.email;
}
function showCrew(){$('admin').classList.add('hidden');$('crew').classList.remove('hidden');}
function onLogin(ev){
  ev.preventDefault();
  var email=$('em').value.trim().toLowerCase(),pin=$('pin').value;
  var err=$('lgErr');err.textContent='';
  if(!email||!pin){err.textContent=tr('bad');return;}
  if(!API_URL){
    if(pin===PREVIEW_PIN){session={email:email,token:'preview'};$('pin').value='';closeLogin();showAdmin();}
    else err.textContent=tr('bad');
    return;
  }
  $('lgGo').disabled=true;
  post({action:'login',email:email,pin:pin}).then(function(r){
    $('lgGo').disabled=false;$('pin').value='';
    if(r&&r.ok){session={email:email,token:r.token};closeLogin();showAdmin();}
    else err.textContent=(r&&r.locked)?tr('locked'):tr('bad');
  }).catch(function(){$('lgGo').disabled=false;err.textContent=tr('net');});
}
function logout(){session=null;showCrew();}

/* ====== WIRING ====== */
document.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase();
  if(e.altKey&&(e.ctrlKey||e.shiftKey)&&(k==='m'||e.code==='KeyM')){e.preventDefault();openLogin();}
  else if(e.key==='Escape'){if(!$('infoModal').classList.contains('hidden'))closeInfo();else if(!$('loginModal').classList.contains('hidden'))closeLogin();}
});
window.addEventListener('hashchange',function(){if(location.hash==='#admin')openLogin();});
$('f').addEventListener('submit',onSubmit);
$('location').addEventListener('change',function(){var o=$('location').value==='__other';$('locationOther').classList.toggle('hidden',!o);if(o)$('locationOther').focus();});
$('lf').addEventListener('submit',onLogin);
$('inX').addEventListener('click',closeInfo);
$('infoModal').addEventListener('click',function(e){if(e.target===$('infoModal'))closeInfo();});
$('inGo').addEventListener('click',function(){closeInfo();choose(infoKey);});
$('lgX').addEventListener('click',closeLogin);
$('logout').addEventListener('click',logout);
$('lEN').addEventListener('click',function(){setLang('en');});
$('lID').addEventListener('click',function(){setLang('id');});
window.addEventListener('online',flushQueue);

$('date').value=today();
try{var nm=localStorage.getItem('uauc_name');if(nm)$('name').value=nm;}catch(e){}
applyLang();flushQueue();
if(location.hash==='#admin')openLogin();
})();
</script>
